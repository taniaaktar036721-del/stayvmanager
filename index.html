<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>StayVerified manager review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#122021;--green:#2b7124;--deep:#1b4d17;--gold:#fac514;--paper:#f3f6f1;--line:#d3dccd;--mute:#56665a;--red:#b3261e}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:4px solid var(--gold)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
header img{height:44px;width:auto;display:block}
header span{font:600 15px Sora,system-ui,sans-serif;color:var(--deep)}
main{padding:20px 0 56px}
section{background:#fff;border:1px solid var(--line);border-left:6px solid var(--green);border-radius:6px;padding:18px 16px;margin-bottom:18px}
section.mgr{border-left-color:var(--gold)}
h2{font:700 19px Sora,system-ui,sans-serif;margin:0 0 4px}
h3{font:600 16px Sora,system-ui,sans-serif;margin:0 0 8px}
.hint{margin:0 0 8px;color:var(--mute);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #b3c0ae;border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0}
.item textarea{margin-top:8px}
.ih{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ih input{font:600 16px Sora,system-ui,sans-serif;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:4px 0;flex:1}
.rm{flex:none;width:40px;height:40px;background:none;border:0;color:var(--mute);font-size:24px;line-height:1;cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 88px;min-height:44px;border:1.5px solid #b3c0ae;background:#fff;border-radius:6px;font:600 14px Figtree,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.on[data-v=match],.seg button.on[data-v=present]{background:var(--green);border-color:var(--green)}
.seg button.on[data-v=partial]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.seg button.on[data-v=none],.seg button.on[data-v=absent]{background:var(--red);border-color:var(--red)}
.rate{display:flex;gap:4px;margin-top:12px}
.rate button{flex:1;height:40px;border:0;border-radius:3px;background:#e2e9de;cursor:pointer;padding:0}
.rate button.on{background:var(--c)}
.rlab{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:13px;color:var(--mute)}
.rlab b{color:var(--ink)}
.add{margin-top:12px;background:none;border:1.5px dashed var(--green);color:var(--deep);border-radius:6px;padding:10px 14px;font:600 14px Figtree,system-ui,sans-serif;cursor:pointer}
.near{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.near .rm{justify-self:end;align-self:center}
.bad{border-color:var(--red)!important}
.item.bad{border-left:4px solid var(--red);padding-left:10px;background:#fdf4f3}
.send{width:100%;min-height:54px;background:var(--green);color:#fff;border:0;border-radius:8px;font:700 17px Sora,system-ui,sans-serif;cursor:pointer}
.send:disabled{opacity:.6;cursor:default}
#msg,#gmsg{margin:12px 0 0;font-weight:600}
.err{color:var(--red)}.ok{color:var(--green)}
</style>
</head>

const RL = ["Poor","Weak","Below par","Acceptable","Good","Very good","Excellent"];

let D, K, timer;

function el(t,a,...k){const e=document.createElement(t);
  for(const [n,v] of Object.entries(a||{})){
    if(n==="class")e.className=v; else if(n.startsWith("on"))e.addEventListener(n.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(n,v);
  }
  k.flat().forEach(c=>e.append(c&&c.nodeType?c:String(c==null?"":c)));return e}
function save(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}},400)}

function txt(o,k,x){x=x||{};
  const e=el(x.area?"textarea":"input",{type:x.area?false:(x.type||"text"),placeholder:x.ph||"","aria-label":x.ph||x.al||false,"data-m":x.req?1:false});
  e.value=o[k]||"";
  e.addEventListener("input",()=>{o[k]=e.value;e.classList.remove("bad");save()});return e}
function seg(o,k,opts,after){
  const w=el("div",{class:"seg",role:"group"});
  const paint=()=>[...w.children].forEach(b=>b.classList.toggle("on",b.dataset.v===o[k]));
  opts.forEach(([v,l])=>w.append(el("button",{type:"button","data-v":v,onclick:()=>{o[k]=v;paint();if(after)after();save()}},l)));
  paint();return w}
function rate(o,k){
  const w=el("div"),bar=el("div",{class:"rate"}),lab=el("div",{class:"rlab"});
  const paint=()=>{
    [...bar.children].forEach((b,i)=>b.classList.toggle("on",i<o[k]));
    lab.innerHTML="";
    lab.append(el("span",{},"1 Poor"),el("b",{},o[k]?`${o[k]}/7 · ${RL[o[k]-1]}`:"Tap to rate"),el("span",{},"7 Excellent"));
  };
  RL.forEach((n,i)=>bar.append(el("button",{type:"button","aria-label":`${i+1} of 7, ${n}`,style:`--c:${RC[i]}`,onclick:()=>{o[k]=i+1;paint();save()}})));
  w.append(bar,lab);paint();return w}
let uid=0;
function f(label,node){
  const l=el("label",{},label);
  if(/^(INPUT|TEXTAREA)$/.test(node.tagName)){node.id="f"+(++uid);l.htmlFor=node.id}else node.setAttribute("aria-label",label);
  return el("div",{},l,node)}

function list(host,arr,make,fresh,label){
  const draw=()=>{host.innerHTML="";arr.forEach((o,i)=>host.append(make(o,()=>{arr.splice(i,1);draw();save()})))};
  draw();

  n._o=o;n._k="amenity";return n}
function room(o,rm){
  const n=el("div",{class:"item"},el("div",{class:"ih"},txt(o,"name",{ph:"Room name"}),xbtn(rm)),

function wrap(font,size,text,maxW){
  const words=String(text||"").split(/\s+/).filter(Boolean),lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;
    if(font.widthOfTextAtSize(t,size)<=maxW)cur=t;else{if(cur)lines.push(cur);cur=w;}}
  if(cur)lines.push(cur);return lines.length?lines:[""];
}

async function buildPdf(report,booking){
  const {PDFDocument} = PDFLib;
  const doc = await PDFDocument.create();
  const reg = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const bold = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const oblique = await doc.embedFont(PDFLib.StandardFonts.HelveticaOblique);
  const logoBytes = Uint8Array.from(atob(document.querySelector("header img").src.split(",")[1]), c=>c.charCodeAt(0));
  const logo = await doc.embedJpg(logoBytes);

  const M=40, W=595.28, H=841.89, CW=W-M*2;
  let page, y, num=0;
  function addPage(){page=doc.addPage([W,H]);y=H-M;
    page.drawRectangle({x:0,y:H-6,width:W,height:6,color:rgbA(PDFC.gold)});}
  function ensure(h){if(y-h<70)addPage();}
  function footer(){
    const pages=doc.getPages();
    pages.forEach((pg,i)=>{
      pg.drawLine({start:{x:M,y:36},end:{x:W-M,y:36},thickness:0.75,color:rgbA(PDFC.line)});
      pg.drawText("StayVerified · Property Inspection Report",{x:M,y:24,size:8,font:reg,color:rgbA(PDFC.mute)});
      const t=`Page ${i+1} of ${pages.length}`;
      pg.drawText(t,{x:W-M-reg.widthOfTextAtSize(t,8),y:24,size:8,font:reg,color:rgbA(PDFC.mute)});
    });
  }
  function header(){
    const lh=logo.height*(28/logo.width);
    page.drawImage(logo,{x:M,y:y-28+(28-lh)/2,width:28,height:lh});
    page.drawText("Property Inspection Report",{x:M+38,y:y-19,size:15,font:bold,color:rgbA(PDFC.ink)});
    const ref=`Inspection ${report.inspectionId||"—"}`;
    page.drawText(ref,{x:W-M-reg.widthOfTextAtSize(ref,9),y:y-9,size:9,font:reg,color:rgbA(PDFC.mute)});
    const dt=`Inspected ${report.inspectionDate||"—"}`;
    page.drawText(dt,{x:W-M-reg.widthOfTextAtSize(dt,9),y:y-21,size:9,font:reg,color:rgbA(PDFC.mute)});
    y-=44; page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:1.5,color:rgbA(PDFC.gold)}); y-=20;
  }
  function sectionHeader(title){
    ensure(30); num++;
    page.drawRectangle({x:M,y:y-22,width:CW,height:22,color:rgbA(PDFC.deep)});
    page.drawRectangle({x:M,y:y-22,width:4,height:22,color:rgbA(PDFC.gold)});
    page.drawText(String(num).padStart(2,"0"),{x:M+12,y:y-15,size:10,font:bold,color:rgbA(PDFC.gold)});
    page.drawText(title.toUpperCase(),{x:M+34,y:y-15,size:10.5,font:bold,color:rgbA(PDFC.white)});
    y-=22+12;
  }
  function fieldRow(label,value,x0,colW){
    x0=x0||M; colW=colW||CW;
    page.drawText(label.toUpperCase(),{x:x0,y,size:7.5,font:bold,color:rgbA(PDFC.mute)});
    const lines=wrap(reg,10.5,value||"—",colW);
    page.drawText(lines[0],{x:x0,y:y-13,size:10.5,font:reg,color:rgbA(PDFC.ink)});
    for(let i=1;i<lines.length;i++)page.drawText(lines[i],{x:x0,y:y-13-14*i,size:10.5,font:reg,color:rgbA(PDFC.ink)});
    return 13+14*lines.length+10;
  }
  function fieldGrid(pairs){
    ensure(60);
    const colW=(CW-24)/2, h0=y;
    let leftH=0, rightH=0;
    pairs.forEach(([l,v],i)=>{
      const x0=i%2===0?M:M+colW+24, before=y;
      if(i%2===0){const used=fieldRow(l,v,x0,colW);leftH=Math.max(leftH,used);}
      else{const savedY=y; const used=fieldRow(l,v,x0,colW); rightH=Math.max(rightH,used); y=savedY;}
      if(i%2===1) y-=Math.max(leftH,rightH);
    });
    if(pairs.length%2===1) y-=leftH;
    y-=6;
  }
  function badge(text,tone){
    const c = tone==="good"?PDFC.green : tone==="warn"?PDFC.gold : tone==="bad"?PDFC.red : PDFC.mute;
    const pad=6, w=bold.widthOfTextAtSize(text,8)+pad*2;
    page.drawRectangle({x:W-M-w,y:y-13,width:w,height:15,color:rgbA(c),opacity: tone==="warn"?1:0.15});
    page.drawRectangle({x:W-M-w,y:y-13,width:w,height:15,borderColor:rgbA(c),borderWidth:1,color:undefined});
    page.drawText(text,{x:W-M-w+pad,y:y-9,size:8,font:bold,color: tone==="warn"?rgbA(PDFC.ink):rgbA(c)});
    return w;
  }
  function toneFor(v){return v==="match"||v==="present"?"good":v==="partial"?"warn":v==="none"||v==="absent"?"bad":"mute";}
  function labelFor(v){return {match:"Match",partial:"Partial match",none:"No match",present:"Present",absent:"Not present"}[v]||"—";}

  function matchRow(title,v){
    ensure(46);
    page.drawText(title,{x:M,y:y-11,size:11,font:bold,color:rgbA(PDFC.ink)});
    badge(labelFor(v.status),toneFor(v.status));
    y-=20;
    if(v.finding){const lines=wrap(reg,9.5,v.finding,CW-4);
      lines.forEach(l=>{page.drawText(l,{x:M,y,size:9.5,font:reg,color:rgbA(PDFC.mute)});y-=13;});
    }
    y-=10; page.drawLine({start:{x:M,y:y+4},end:{x:W-M,y:y+4},thickness:0.5,color:rgbA(PDFC.line)}); y-=6;
  }
  function ratingBar(value,note){
    ensure(40);
    const segW=(CW-24)/7;
    for(let i=0;i<7;i++){
      page.drawRectangle({x:M+i*(segW+4),y:y-8,width:segW,height:8,
        color: value>i?rgbA(RATE_COLORS[i]):rgbA(PDFC.line)});
    }
    y-=20;
    page.drawText("1 Poor",{x:M,y,size:8,font:reg,color:rgbA(PDFC.mute)});
    const mid=value?`${value}/7 · ${RATE_LABELS[value-1]}`:"Not rated";
    page.drawText(mid,{x:M+CW/2-bold.widthOfTextAtSize(mid,8.5)/2,y,size:8.5,font:bold,color:rgbA(PDFC.ink)});
    const r="7 Excellent";
    page.drawText(r,{x:W-M-reg.widthOfTextAtSize(r,8),y,size:8,font:reg,color:rgbA(PDFC.mute)});
    y-=16;
    if(note){const lines=wrap(reg,9.5,note,CW-4);
      lines.forEach(l=>{ensure(14);page.drawText(l,{x:M,y,size:9.5,font:reg,color:rgbA(PDFC.mute)});y-=13;});}
    y-=8;
  }
  function card(title,badgeText,tone,body){
    ensure(70);
    page.drawRectangle({x:M,y:y-2,width:CW,height:2,color:rgbA(PDFC.green)});
    y-=12;
    page.drawText(title.toUpperCase(),{x:M,y:y-2,size:10.5,font:bold,color:rgbA(PDFC.ink)});
    if(badgeText)badge(badgeText,tone);
    y-=18; body(); y-=8;
  }
  function paragraph(text,size,font,color){
    size=size||10; font=font||reg; color=color||PDFC.ink;
    wrap(font,size,text,CW).forEach(l=>{ensure(size+6);page.drawText(l,{x:M,y,size,font,color:rgbA(color)});y-=size+4.5;});
  }
  function nearbyTable(rows){
    ensure(24+rows.length*18);
    const c1=M,c2=M+150,c3=M+330,c4=W-M;
    page.drawRectangle({x:M,y:y-18,width:CW,height:18,color:rgbA(PDFC.paper)});
    page.drawText("AMENITY",{x:c1+6,y:y-13,size:8,font:bold,color:rgbA(PDFC.mute)});
    page.drawText("NAME",{x:c2+6,y:y-13,size:8,font:bold,color:rgbA(PDFC.mute)});
    page.drawText("DISTANCE",{x:c3+6,y:y-13,size:8,font:bold,color:rgbA(PDFC.mute)});
    y-=18;
    rows.forEach(r=>{
      ensure(18);
      page.drawText(r.type||"—",{x:c1+6,y:y-13,size:9.5,font:bold,color:rgbA(PDFC.ink)});
      page.drawText(r.name||"—",{x:c2+6,y:y-13,size:9.5,font:reg,color:rgbA(PDFC.mute)});
      page.drawText(r.distance||"—",{x:c3+6,y:y-13,size:9.5,font:reg,color:rgbA(PDFC.mute)});
      y-=18; page.drawLine({start:{x:M,y:y+4},end:{x:c4,y:y+4},thickness:0.5,color:rgbA(PDFC.line)});
    });
    y-=6;
  }

  addPage(); header();

  sectionHeader("Booking details");
  fieldGrid([
    ["Property",report.property],["Location",report.location],
    ["Dates",booking.travelDates],["Platform",booking.platform],
    ["Inspection ID",report.inspectionId],["Inspection date",report.inspectionDate],
  ]);
  y-=6;

  sectionHeader("Property & listing match");
  (report.listingMatch||[]).forEach(v=>matchRow(v.item,v));
  y-=6;

  sectionHeader("Building amenities");
  (report.buildingAmenities||[]).forEach(a=>{
    card(a.name,labelFor(a.present),toneFor(a.present),()=>{
      if(a.present==="present")ratingBar(a.rating,a.note);
      else if(a.note)paragraph(a.note,9.5,reg,PDFC.mute);
    });
  });

  sectionHeader("Room-by-room inspection");
  (report.rooms||[]).forEach(r=>{
    card(r.name,labelFor(r.status),toneFor(r.status),()=>ratingBar(r.rating,r.note));
  });

  sectionHeader("Location & access");
  const la=report.locationAccess||{};
  fieldGrid([["Airport distance",la.airport],["Parking",la.parking],
             ["Road condition",la.road],["Gate access",la.gate]]);
  y-=6;

  sectionHeader("Neighbourhood intelligence");
  page.drawText("ON-THE-GROUND IMPRESSION",{x:M,y:y-2,size:7.5,font:bold,color:rgbA(PDFC.mute)});y-=16;
  paragraph((report.neighbourhood||{}).impression||"—",10.5);
  y-=6;
  const nb=(report.neighbourhood||{}).nearby||[];
  if(nb.length){page.drawText("NEARBY AMENITIES",{x:M,y:y-2,size:7.5,font:bold,color:rgbA(PDFC.mute)});y-=16;nearbyTable(nb);}

  sectionHeader("Summary");
  ensure(60);
  page.drawRectangle({x:M,y:y-2,width:CW,height:2,color:rgbA(PDFC.gold)});
  y-=14;
  paragraph(report.summary||"—",10.5);
  y-=10;
  const note="This report records observations made at a single visit and information available at the time of inspection. It is not a guarantee of condition, ownership, occupancy, safety or future availability, and does not constitute legal or surveying advice. StayVerified accepts no liability for decisions taken on the basis of this report.";
  ensure(50);
  page.drawLine({start:{x:M,y:y+6},end:{x:W-M,y:y+6},thickness:0.75,color:rgbA(PDFC.line)});y-=6;
  wrap(oblique,8.5,note,CW).forEach(l=>{ensure(12);page.drawText(l,{x:M,y,size:8.5,font:oblique,color:rgbA(PDFC.mute)});y-=12;});

  footer();
  const bytes = await doc.save();
  let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin);
}

const SAMPLE_BOOKING = {clientName:"", clientEmail:"", clientPhone:"", travelDates:"12 – 18 September 2026", platform:"Airbnb"};

async function previewSample(btn,msg){
  btn.disabled=true; msg.textContent="Building a sample PDF…"; msg.className="";
  try{
    const b64=await buildPdf(SAMPLE_REPORT,SAMPLE_BOOKING);
    const url="data:application/pdf;base64,"+b64;
    const a=el("a",{href:url,download:"StayVerified-sample-report.pdf"});
    document.body.append(a);a.click();a.remove();
    msg.textContent="Sample PDF downloaded — this uses placeholder data, not a real submission.";msg.className="ok";
  }catch(e){console.error(e);msg.textContent="Could not build the sample PDF.";msg.className="err";}
  btn.disabled=false;
}

function build(){
  $("#gate").hidden=true;
  const F=$("#form");F.hidden=false;F.innerHTML="";
  const S=D.S,B=D.B,amH=el("div"),rmH=el("div"),nbH=el("div");
  const sum=txt(D,"sum",{area:1,req:1,al:"Overall summary"});sum.style.minHeight="190px";
  const msg=el("p",{id:"msg",role:"status"});
  const regen=SUMMARY_URL?el("button",{type:"button",class:"add",onclick:async e=>{
    const b=e.target;b.disabled=true;msg.className="";msg.textContent="Writing a new draft…";
    try{const r=await fetch(SUMMARY_URL,{method:"POST",headers:JSONH,body:JSON.stringify({report:toP(S,"")})});
      const j=await r.json();if(!j.summary)throw 0;D.sum=j.summary;sum.value=j.summary;save();msg.textContent="New draft added. Review it before approving.";msg.className="ok"}
    catch(err){msg.textContent="Could not write a new draft. Your current summary is unchanged.";msg.className="err"}
    b.disabled=false}},"Write a new draft from the current data"):"";
  const go=el("button",{class:"send",type:"button",onclick:()=>approve(go,msg)},"Approve and send to client");
  F.append(
    sec("Client and booking","Manager only. Client name, email and phone are never printed on the report. Travel dates and platform are.","mgr",
      f("Client name",txt(B,"clientName")),
      f("Client email *",txt(B,"clientEmail",{type:"email",req:1})),
      f("Client phone",txt(B,"clientPhone",{type:"tel"})),
      f("Travel dates",txt(B,"travelDates",{ph:"e.g. 12 – 18 September 2026"})),
      f("Platform",txt(B,"platform",{ph:"e.g. Airbnb"}))),
    sec("Inspection details","Submitted by the inspector. Edit anything before approving.","",
      f("Inspection ID *",txt(S.meta,"inspectionId",{req:1})),
      f("Inspection date *",txt(S.meta,"inspectionDate",{type:"date",req:1})),
      f("Property (name or unit) *",txt(S.meta,"property",{req:1})),
      f("Location (area, city) *",txt(S.meta,"location",{req:1}))),
    sec("Listing match",null,"",...S.listing.map(matchItem)),
    sec("Building amenities",null,"",amH,list(amH,S.amenities,amenity,()=>({name:"",present:"",rating:0,note:""}),"Add amenity")),
    sec("Rooms",null,"",rmH,list(rmH,S.rooms,room,()=>({name:"",status:"",rating:0,note:""}),"Add room")),
    sec("Location and access",null,"",
      f("Airport distance",txt(S.access,"airport",{area:1})),f("Parking",txt(S.access,"parking",{area:1})),
      f("Road condition",txt(S.access,"road",{area:1})),f("Gate access",txt(S.access,"gate",{area:1}))),
    sec("Neighbourhood",null,"",
      f("On-the-ground impression",txt(S.area,"impression",{area:1})),
      el("label",{},"Nearby amenities"),nbH,list(nbH,S.area.nearby,near,()=>({type:"",name:"",distance:""}),"Add place")),
    sec("Visit notes",null,"",
      f("Was the host present?",seg(S.visit,"host",[["yes","Yes"],["no","No"]])),
      f("Access to the unit",seg(S.visit,"access",[["full","Full"],["partial","Partial"],["none","None"]])),
      f("Smoke alarm test",seg(S.visit,"smoke",[["works","Works"],["fails","Not working"],["unchecked","Not checked"]])),
      f("Fire extinguisher last serviced",txt(S.visit,"extinguisher")),
      f("Anything else worth noting",txt(S.visit,"other",{area:1}))),
    sec("Overall summary","Drafted from the inspector's ratings and notes. Edit it, and keep it to what was found: no verdict or recommendation.","mgr",
      f("Summary *",sum),regen),
    el("div",{},go,msg));
}

function validate(){
  const F=$("#form");F.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
  let first=null;const flag=e=>{e.classList.add("bad");first=first||e};
  F.querySelectorAll("[data-m]").forEach(i=>{if(!i.value.trim())flag(i)});
  const em=F.querySelector("input[type=email]");
  if(em&&em.value.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim()))flag(em);
  F.querySelectorAll(".item").forEach(n=>{
    const o=n._o;if(!o)return;
    if(n._k==="listing"&&(!o.status||(o.status!=="match"&&!o.finding.trim())))flag(n);
    if(n._k==="room"&&(!o.name.trim()||!o.status||!o.rating||(o.status!=="match"&&!o.note.trim())))flag(n);
    if(n._k==="amenity"&&(!o.name.trim()||!o.present||(o.present==="present"&&!o.rating)))flag(n);
  });
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
  return !first}

async function approve(b,msg){
  msg.className="";
  if(!validate()){msg.textContent="Complete the highlighted items. A partial or no match needs a note.";msg.className="err";return}
  const email=D.B.clientEmail.trim(),name=D.B.clientName.trim();
  if(!confirm(`Send the report to ${name||"the client"} at ${email}?`))return;
  b.disabled=true;msg.textContent="Preparing the report…";
  try{
    const report=toP(D.S,D.sum),pdf=await buildPdf(report,D.B);
    const body=JSON.stringify({id:ID,clientEmail:email,clientName:name,report,summary:D.sum.trim(),pdfBase64:pdf});
    if(!APPROVE_URL){
      const a=el("a",{href:URL.createObjectURL(new Blob([body],{type:"application/json"})),download:`approved-${report.inspectionId||"draft"}.json`});
      document.body.append(a);a.click();a.remove();
      msg.textContent="Test mode: nothing was sent. A JSON copy of the approved report was downloaded.";msg.className="ok";b.disabled=false;return}
    if(!pdf)throw "The PDF generator is not connected yet, so nothing was sent.";
    const r=await fetch(APPROVE_URL,{method:"POST",headers:JSONH,body});
    if(!r.ok)throw "The server did not accept the report. Try again.";
    localStorage.removeItem(K);
    msg.textContent=`Approved. The report is on its way to ${email}.`;msg.className="ok";b.textContent="Sent";
  }catch(e){
    msg.textContent=typeof e==="string"?e:"Could not send. Check your connection and try again. Your edits are saved on this device.";
    msg.className="err";b.disabled=false}}

function start(res){
  const p=res.submission||{};
  K="sv_review_"+(ID||p.inspectionId||"draft");
  let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
  D=d||{S:fromP(p),
    B:Object.assign({clientName:"",clientEmail:"",clientPhone:"",travelDates:"",platform:""},res.booking),
    sum:res.summary||p.summary||""};
  build()}

async function openSub(pass){
  const r=await fetch(REVIEW_URL,{method:"POST",headers:JSONH,body:JSON.stringify({id:ID,passcode:pass})});
  if(r.status===401||r.status===403)throw "That passcode is not correct.";
  if(!r.ok)throw "Could not load this submission.";
  return r.json()}

(function gate(){
  $("#previewBtn").addEventListener("click",()=>previewSample($("#previewBtn"),$("#pmsg")));
  const g=$("#gateBody"),gm=$("#gmsg");
  if(REVIEW_URL){
    if(!ID){gm.textContent="This link has no submission ID. Use the link from the email.";return}
    const pw=el("input",{type:"password","aria-label":"Passcode",placeholder:"Passcode",autocomplete:"current-password"});
    const go=el("button",{type:"button",class:"send",onclick:async()=>{
      gm.textContent="Opening…";go.disabled=true;
      try{start(await openSub(pw.value))}
      catch(e){gm.textContent=typeof e==="string"?e:"Could not open this submission. Check your connection.";go.disabled=false}}},"Open submission");
    pw.addEventListener("keydown",e=>{if(e.key==="Enter")go.click()});
    g.append(pw,el("div",{style:"height:12px"}),go);
  }else{
    $("#gh").textContent="Test mode: no server is connected. Load the JSON file downloaded from the inspector form.";
    const fi=el("input",{type:"file",accept:"application/json,.json","aria-label":"Inspector JSON file"});
    fi.addEventListener("change",async()=>{
      try{start({submission:JSON.parse(await fi.files[0].text())})}
      catch(e){gm.textContent="That file could not be read as an inspector submission."}});
    g.append(fi);
  }
})();
</script>
